<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engineering Projects — Quintin de Jongh</title>
  <meta name="description" content="Engineering projects by Quintin de Jongh — work, academic and personal.">
  <link rel="icon" href="/assets/images/qlogo.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div id="qdj-navbar"></div>

  <!-- PAGE HERO -->
  <div class="page-hero">
    <div class="container">
      <span class="eyebrow reveal">Portfolio</span>
      <h1 class="reveal">Engineering Projects</h1>
      <p class="reveal">Personal, academic and work-related projects across mechanical design, CAE and product development.</p>
    </div>
  </div>

  <!-- FILTER TABS -->
  <section style="padding:40px 0 0;">
    <div class="container">
      <div id="filter-tabs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:40px;" class="reveal">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Work">Work</button>
        <button class="filter-btn" data-filter="Academic">Academic</button>
      </div>

      <!-- Contentful notice (hidden once loaded) -->
      <div id="cf-setup-notice" class="notice info" style="display:none;">
        <strong>Contentful not yet connected.</strong> Showing static project data. Visit <a href="/admin.html">Admin Portal</a> to connect your Contentful space and manage projects dynamically.
      </div>

      <!-- Project grid -->
      <div id="projects-grid" class="grid grid-auto-280 reveal" style="padding-bottom:80px;">
        <!-- Populated by JS below -->
      </div>
    </div>
  </section>

  <div id="qdj-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/contentful.js"></script>
  <script src="/js/site.js"></script>
  <script>
    /* ── Static fallback data ─────────────────────────────── */
    const STATIC_ENG = [
      { title: "Pharmaceutical Utilities Engineering",  category: "Work",     img: "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=800&q=80", link: "#", summary: "Mechanical design and delivery of steam, chilled water, compressed air, potable water, and water treatment systems for a highly regulated manufacturing facility." },
      { title: "Industrial HVAC Design & CFD Validation", category: "Work",  img: "https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?auto=format&fit=crop&w=800&q=80", link: "#", summary: "Engineering of large-scale HVAC systems and complex CFD simulations validating airflow and thermal performance for a major regulated facility." },
      { title: "Hydrogen Reformer Optimisation",        category: "Work",     img: "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=800&q=80", link: "#", summary: "CFD-driven (OpenFOAM) optimisation of a hydrogen reformer to enhance thermal efficiency, flow uniformity, and structural robustness in high-temperature reactive environments." },
      { title: "Thermal-Fluid CAE Consultancy",         category: "Work",     img: "https://images.unsplash.com/photo-1565372195458-9de0b320ef04?auto=format&fit=crop&w=800&q=80", link: "#", summary: "Advanced OpenFOAM CFD simulations and 3D modelling (FreeCAD, SALOME) for thermal-fluid product development, translating CAE insights into manufacturable components." },
      { title: "Hydrogen Reformer",                     category: "Work",     img: "/assets/images/ReformerTubes.jpg", link: "/engineering/Hydrogen.html", summary: "Lead engineer on a complete hydrogen steam methane reformer — CAD, FEA, commissioning and PLC control." },
      { title: "DCMD Desalination Product",             category: "Work",     img: "/assets/images/DCMDModule.png",    link: "/engineering/DCMD.html",     summary: "Direct Contact Membrane Distillation product designed and developed from concept to working prototype." },
      { title: "Custom Bracket Hook",                   category: "Work",     img: "/assets/images/BracketB.jpeg",     link: "/engineering/Bracket.html",  summary: "Structural bracket design and analysis for an industrial application." },
      { title: "Crate Structural Analysis",             category: "Work",     img: "/assets/images/Agr2.jpg",          link: "/engineering/FruitCrate.html",summary: "FEA and structural analysis of a commercial fruit crate under various load conditions." },
      { title: "Flexolap Polisher",                     category: "Academic", img: "/assets/images/flexolap.png",      link: "/engineering/Flexolap.html", summary: "MSc thesis — a machine to mechanically polish Ti-6Al-4V components to a mirror finish." },
      { title: "Vehicle Polisher",                      category: "Academic", img: "/assets/images/op2.PNG",           link: "/engineering/polish.html",   summary: "Orbital polishing machine designed for safe and effective vehicle surface finishing." },
    ];

    const tagClass = { Work: "work", Academic: "academic", Personal: "personal", Friend: "friend" };

    function renderCards(items) {
      const grid = document.getElementById("projects-grid");
      grid.innerHTML = items.map(p => `
        <a href="${p.link || '#'}" class="card-project">
          <div class="card-project-img">
            <img src="${p.img || '/assets/images/qlogo.png'}" alt="${p.title}" loading="lazy">
            <div class="card-project-overlay"><span>View Project</span></div>
          </div>
          <div class="card-project-body">
            <span class="card-tag ${tagClass[p.category] || ''}">${p.category || ''}</span>
            <h3>${p.title}</h3>
            <p>${p.summary || ''}</p>
          </div>
        </a>`).join("");
    }

    let allProjects = [];

    async function loadProjects() {
      const cf = window.QDJ_cf;
      if (cf && cf.isConfigured()) {
        try {
          const res = await cf.getEntries("engineeringProject", { order: "fields.order" });
          if (res.items && res.items.length) {
            allProjects = res.items.map(item => {
              const f = item.fields || {};
              return {
                title:    f.title || "",
                category: f.category || "",
                img:      f.imageUrl || cf.assetUrl(f.image, res.includes) || "",
                link:     f.link || "#",
                summary:  f.summary || "",
              };
            });
            renderCards(allProjects);
            return;
          }
        } catch (e) { console.warn("Contentful load failed", e); }
      }
      // Fallback
      document.getElementById("cf-setup-notice").style.display = "block";
      allProjects = STATIC_ENG;
      renderCards(allProjects);
    }

    /* ── Filter logic ─────────────────────────────────────── */
    document.addEventListener("DOMContentLoaded", () => {
      loadProjects();

      document.getElementById("filter-tabs").addEventListener("click", e => {
        const btn = e.target.closest(".filter-btn");
        if (!btn) return;
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const f = btn.dataset.filter;
        renderCards(f === "all" ? allProjects : allProjects.filter(p => p.category === f));
      });
    });
  </script>

  <style>
    .filter-btn {
      padding: 8px 20px; border-radius: var(--radius-pill); border: 1.5px solid var(--line);
      background: none; font-family: var(--font-main); font-size: .86rem; font-weight: 600;
      color: var(--text-muted); cursor: pointer; transition: all .18s ease;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; }
  </style>
</body>
</html>

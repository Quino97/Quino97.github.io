<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Projects — Quintin de Jongh</title>
  <meta name="description" content="Personal projects by Quintin de Jongh — 3D printing, woodworking, home engineering and more.">
  <link rel="icon" href="/assets/images/qlogo.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div id="qdj-navbar"></div>

  <!-- PAGE HERO -->
  <div class="page-hero">
    <div class="container">
      <span class="eyebrow reveal">Side Projects</span>
      <h1 class="reveal">Personal Projects</h1>
      <p class="reveal">3D printing, woodworking, home engineering tasks and other hands-on builds.</p>
    </div>
  </div>

  <!-- FILTER TABS -->
  <section style="padding:40px 0 0;">
    <div class="container">
      <div id="filter-tabs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:40px;" class="reveal">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Personal">Personal</button>
        <button class="filter-btn" data-filter="Academic">Academic</button>
        <button class="filter-btn" data-filter="For Friend">For Friend</button>
      </div>

      <!-- Contentful notice -->
      <div id="cf-setup-notice" class="notice info" style="display:none;">
        <strong>Contentful not yet connected.</strong> Showing static project data. Visit <a href="/admin.html">Admin Portal</a> to connect your Contentful space.
      </div>

      <!-- Project grid -->
      <div id="projects-grid" class="grid grid-auto-280 reveal" style="padding-bottom:80px;">
        <!-- Populated by JS -->
      </div>
    </div>
  </section>

  <div id="qdj-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/contentful.js"></script>
  <script src="/js/site.js"></script>
  <script>
    /* ── Static fallback data ─────────────────────────────── */
    const STATIC_PER = [
      { title: "3D Printing",        category: "Personal",  img: "/assets/images/holder2.jpg",     link: "/personal/3DPrint.html",    summary: "A collection of 3D printed parts, holders and small engineering solutions." },
      { title: "Zero G",             category: "Personal",  img: "/assets/images/zg.png",           link: "/engineering/ZeroG.html",   summary: "Personal project exploring a Zero-G concept design and prototype." },
      { title: "Benches",            category: "Personal",  img: "/assets/images/Bench.jpeg",       link: "/personal/Benches.html",    summary: "Handcrafted outdoor benches built from scratch." },
      { title: "Murphy Bed",         category: "Personal",  img: "/assets/images/MurphyBed.jpeg",   link: "/personal/MurphyBed.html",  summary: "Design and build of a space-saving wall fold-down Murphy bed." },
      { title: "Outdoor Couches",    category: "Personal",  img: "/assets/images/Couch.jpeg",       link: "/personal/Couches.html",    summary: "Outdoor couch set built from timber and steel — from design to assembly." },
      { title: "Art Display Shelving", category: "For Friend", img: "/assets/images/shelving.jpg",  link: "/personal/artdisplay.html", summary: "Custom display shelving unit designed and built for a friend's art collection." },
      { title: "IGS",                category: "Academic",  img: "/assets/images/igs.PNG",          link: "/engineering/IGS.html",     summary: "Academic project involving an integrated gear system design and analysis." },
    ];

    const tagClass = { Work: "work", Academic: "academic", Personal: "personal", "For Friend": "friend" };

    function renderCards(items) {
      const grid = document.getElementById("projects-grid");
      grid.innerHTML = items.map(p => `
        <a href="${p.link || '#'}" class="card-project">
          <div class="card-project-img">
            <img src="${p.img || '/assets/images/qlogo.png'}" alt="${p.title}" loading="lazy">
            <div class="card-project-overlay"><span>View Project</span></div>
          </div>
          <div class="card-project-body">
            <span class="card-tag ${tagClass[p.category] || ''}">${p.category || ''}</span>
            <h3>${p.title}</h3>
            <p>${p.summary || ''}</p>
          </div>
        </a>`).join("");
    }

    let allProjects = [];

    async function loadProjects() {
      const cf = window.QDJ_cf;
      if (cf && cf.isConfigured()) {
        try {
          const res = await cf.getEntries("personalProject", { order: "fields.order" });
          if (res.items && res.items.length) {
            allProjects = res.items.map(item => {
              const f = item.fields || {};
              return {
                title:    f.title || "",
                category: f.category || "",
                img:      f.imageUrl || cf.assetUrl(f.image, res.includes) || "",
                link:     f.link || "#",
                summary:  f.summary || "",
              };
            });
            renderCards(allProjects);
            return;
          }
        } catch (e) { console.warn("Contentful load failed", e); }
      }
      document.getElementById("cf-setup-notice").style.display = "block";
      allProjects = STATIC_PER;
      renderCards(allProjects);
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadProjects();
      document.getElementById("filter-tabs").addEventListener("click", e => {
        const btn = e.target.closest(".filter-btn");
        if (!btn) return;
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const f = btn.dataset.filter;
        renderCards(f === "all" ? allProjects : allProjects.filter(p => p.category === f));
      });
    });
  </script>

  <style>
    .filter-btn {
      padding: 8px 20px; border-radius: var(--radius-pill); border: 1.5px solid var(--line);
      background: none; font-family: var(--font-main); font-size: .86rem; font-weight: 600;
      color: var(--text-muted); cursor: pointer; transition: all .18s ease;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; }
  </style>
</body>
</html>
